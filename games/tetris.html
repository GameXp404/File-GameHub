<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8" /><title>🟦 Tetris Classic</title>
<link rel="stylesheet" href="game.css" />
</head><body>
<a href="../index.html" class="back-to-hub">← Kembali ke Hub</a>
<div class="game-wrap">
  <h1>🟦 Tetris Classic</h1>
  <div class="subtitle">← → gerak, ↑ rotate, ↓ drop cepat, Space hard-drop</div>
  <div class="score-row">
    <div class="score-box">Skor<b id="score">0</b></div>
    <div class="score-box">Lines<b id="lines">0</b></div>
    <div class="score-box">Level<b id="level">1</b></div>
    <div class="score-box">Best<b id="best">0</b></div>
  </div>
  <canvas id="c" width="300" height="600"></canvas>
  <div class="message" id="msg">Tekan tombol arah untuk mulai</div>
  <button class="primary" id="restart">🔄 Game Baru</button>
</div>
<script>
const C=10,R=20,S=30;const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLORS=['','#00f0f0','#f0f000','#a000f0','#00f000','#f00000','#0000f0','#f0a000'];
const PIECES={I:[[1,1,1,1]],O:[[2,2],[2,2]],T:[[0,3,0],[3,3,3]],S:[[0,4,4],[4,4,0]],Z:[[5,5,0],[0,5,5]],J:[[6,0,0],[6,6,6]],L:[[0,0,7],[7,7,7]]};
let grid,piece,px,py,score,lines,level,gameOver,dropTimer;
function reset(){grid=Array.from({length:R},()=>Array(C).fill(0));score=lines=0;level=1;gameOver=false;newPiece();update();draw();if(dropTimer)clearInterval(dropTimer);dropTimer=setInterval(tick,Math.max(100,500-level*30));}
function newPiece(){const k=Object.keys(PIECES);piece=PIECES[k[Math.floor(Math.random()*k.length)]].map(r=>[...r]);px=Math.floor((C-piece[0].length)/2);py=0;if(collide(piece,px,py)){gameOver=true;document.getElementById('msg').textContent='💀 Game Over! Skor: '+score;const b=Math.max(score,parseInt(localStorage.tetrisBest||0));localStorage.tetrisBest=b;document.getElementById('best').textContent=b;clearInterval(dropTimer);}}
function collide(p,x,y){for(let r=0;r<p.length;r++)for(let c=0;c<p[r].length;c++){if(!p[r][c])continue;const nx=x+c,ny=y+r;if(nx<0||nx>=C||ny>=R)return true;if(ny>=0&&grid[ny][nx])return true;}return false;}
function merge(){for(let r=0;r<piece.length;r++)for(let c=0;c<piece[r].length;c++)if(piece[r][c]&&py+r>=0)grid[py+r][px+c]=piece[r][c];}
function clearLines(){let n=0;for(let r=R-1;r>=0;r--){if(grid[r].every(v=>v)){grid.splice(r,1);grid.unshift(Array(C).fill(0));n++;r++;}}if(n){lines+=n;score+=[0,40,100,300,1200][n]*level;level=Math.floor(lines/10)+1;clearInterval(dropTimer);dropTimer=setInterval(tick,Math.max(100,500-level*30));}}
function rotate(){const p=piece;const n=p[0].length,m=p.length;const r=Array.from({length:n},()=>Array(m).fill(0));for(let i=0;i<m;i++)for(let j=0;j<n;j++)r[j][m-1-i]=p[i][j];if(!collide(r,px,py))piece=r;}
function tick(){if(gameOver)return;if(!collide(piece,px,py+1))py++;else{merge();clearLines();newPiece();}update();draw();}
function hardDrop(){while(!collide(piece,px,py+1))py++;merge();clearLines();newPiece();update();draw();}
function update(){document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;document.getElementById('level').textContent=level;document.getElementById('best').textContent=localStorage.tetrisBest||0;}
function draw(){ctx.fillStyle='#0a0e22';ctx.fillRect(0,0,cv.width,cv.height);for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(grid[r][c]){ctx.fillStyle=COLORS[grid[r][c]];ctx.fillRect(c*S,r*S,S-1,S-1);}if(piece&&!gameOver)for(let r=0;r<piece.length;r++)for(let c=0;c<piece[r].length;c++)if(piece[r][c]){ctx.fillStyle=COLORS[piece[r][c]];ctx.fillRect((px+c)*S,(py+r)*S,S-1,S-1);}}
window.addEventListener('keydown',e=>{if(gameOver)return;const k=e.key;if(k==='ArrowLeft'){if(!collide(piece,px-1,py))px--;}else if(k==='ArrowRight'){if(!collide(piece,px+1,py))px++;}else if(k==='ArrowDown'){if(!collide(piece,px,py+1))py++;}else if(k==='ArrowUp'){rotate();}else if(k===' '){hardDrop();return;}else return;e.preventDefault();draw();});
document.getElementById('restart').onclick=reset;reset();
</script></body></html>
