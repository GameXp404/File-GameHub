<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8" /><title>🧠 Memory Match</title>
<link rel="stylesheet" href="game.css" />
<style>
  .board { display: inline-grid; grid-template-columns: repeat(4, 80px); gap: 8px; }
  .card { width:80px;height:80px;background:#6b46ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;color:transparent;transition:transform 0.2s, background 0.2s; }
  .card:hover { transform: scale(1.05); }
  .card.flipped { background: #fff; color: #000; }
  .card.matched { background: #00d4ff; color: #000; cursor: default; }
</style></head><body>
<a href="../index.html" class="back-to-hub">← Kembali ke Hub</a>
<div class="game-wrap">
  <h1>🧠 Memory Match</h1>
  <div class="subtitle">Cocokkan pasangan kartu. Sedikit langkah = makin bagus!</div>
  <div class="score-row">
    <div class="score-box">Langkah<b id="moves">0</b></div>
    <div class="score-box">Cocok<b id="matched">0/8</b></div>
    <div class="score-box">Best<b id="best">-</b></div>
  </div>
  <div class="board" id="board"></div>
  <div class="message" id="msg">Klik kartu untuk membuka</div>
  <button class="primary" id="restart">🔄 Game Baru</button>
</div>
<script>
const ICONS = ['🍎','🍌','🍇','🍓','🍒','🥝','🍑','🍍'];
let cards, flipped, matched, moves, lock;
function init() {
  const deck = [...ICONS, ...ICONS].sort(() => Math.random()-0.5);
  cards = deck.map(icon => ({icon, flipped:false, matched:false}));
  flipped = []; matched = 0; moves = 0; lock = false;
  render();
  document.getElementById('msg').textContent = 'Klik kartu untuk membuka';
}
function render() {
  const b = document.getElementById('board'); b.innerHTML = '';
  cards.forEach((c,i) => {
    const d = document.createElement('div');
    d.className = 'card' + (c.matched ? ' matched' : c.flipped ? ' flipped' : '');
    d.textContent = c.icon;
    d.onclick = () => flip(i);
    b.appendChild(d);
  });
  document.getElementById('moves').textContent = moves;
  document.getElementById('matched').textContent = matched + '/8';
  document.getElementById('best').textContent = localStorage.memBest || '-';
}
function flip(i) {
  if (lock || cards[i].flipped || cards[i].matched) return;
  cards[i].flipped = true; flipped.push(i); render();
  if (flipped.length === 2) {
    moves++; lock = true;
    const [a,b] = flipped;
    if (cards[a].icon === cards[b].icon) {
      cards[a].matched = cards[b].matched = true; matched++;
      flipped = []; lock = false; render();
      if (matched === 8) {
        document.getElementById('msg').textContent = `🎉 Selesai dalam ${moves} langkah!`;
        const best = parseInt(localStorage.memBest || '999');
        if (moves < best) localStorage.memBest = moves;
        render();
      }
    } else {
      setTimeout(() => {
        cards[a].flipped = cards[b].flipped = false;
        flipped = []; lock = false; render();
      }, 800);
    }
  }
}
document.getElementById('restart').onclick = init;
init();
</script>
</body></html>
