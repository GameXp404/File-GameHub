<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8" /><title>🔢 2048</title>
<link rel="stylesheet" href="game.css" />
<style>
  .board { display: inline-grid; grid-template-columns: repeat(4,80px); gap: 8px; background: #0f1729; padding: 10px; border-radius: 8px; border: 3px solid #6b46ff; }
  .tile { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; border-radius: 6px; background: #2a2a4a; color: #fff; transition: all 0.1s; }
  .v2{background:#eee4da;color:#776e65}.v4{background:#ede0c8;color:#776e65}.v8{background:#f2b179;color:#fff}.v16{background:#f59563;color:#fff}.v32{background:#f67c5f;color:#fff}.v64{background:#f65e3b;color:#fff}.v128{background:#edcf72;color:#fff;font-size:24px}.v256{background:#edcc61;color:#fff;font-size:24px}.v512{background:#edc850;color:#fff;font-size:24px}.v1024{background:#edc53f;color:#fff;font-size:20px}.v2048{background:#edc22e;color:#fff;font-size:20px}.v4096{background:#3c3a32;color:#fff;font-size:20px}
</style></head><body>
<a href="../index.html" class="back-to-hub">← Kembali ke Hub</a>
<div class="game-wrap">
  <h1>🔢 2048</h1>
  <div class="subtitle">Gabungkan tile yang sama dengan tombol panah / WASD. Capai 2048!</div>
  <div class="score-row">
    <div class="score-box">Skor<b id="score">0</b></div>
    <div class="score-box">Best<b id="best">0</b></div>
  </div>
  <div class="board" id="board"></div>
  <div class="message" id="msg">&nbsp;</div>
  <button class="primary" id="restart">🔄 Game Baru</button>
</div>
<script>
let grid, score;
function init() {
  grid = Array.from({length:4}, () => [0,0,0,0]);
  score = 0; addRandom(); addRandom(); update();
}
function addRandom() {
  const empty = [];
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!grid[r][c]) empty.push([r,c]);
  if (!empty.length) return false;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}
function slide(row) {
  const arr = row.filter(v=>v);
  for (let i=0; i<arr.length-1; i++) {
    if (arr[i] === arr[i+1]) { arr[i] *= 2; score += arr[i]; arr.splice(i+1,1); }
  }
  while (arr.length < 4) arr.push(0);
  return arr;
}
function move(dir) {
  const before = JSON.stringify(grid);
  if (dir === 'left')  grid = grid.map(slide);
  if (dir === 'right') grid = grid.map(r => slide(r.reverse()).reverse());
  if (dir === 'up') {
    for (let c=0;c<4;c++) { const col = slide([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]); for(let r=0;r<4;r++) grid[r][c]=col[r]; }
  }
  if (dir === 'down') {
    for (let c=0;c<4;c++) { const col = slide([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]); for(let r=0;r<4;r++) grid[3-r][c]=col[r]; }
  }
  if (JSON.stringify(grid) === before) return;
  addRandom();
  update();
  if (grid.flat().includes(2048)) document.getElementById('msg').textContent = '🏆 Kamu menang!';
  else if (!canMove()) document.getElementById('msg').textContent = '💀 Game Over!';
}
function canMove() {
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (!grid[r][c]) return true;
    if (c<3 && grid[r][c]===grid[r][c+1]) return true;
    if (r<3 && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}
function update() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  grid.flat().forEach(v => {
    const d = document.createElement('div');
    d.className = 'tile' + (v ? ' v'+v : '');
    d.textContent = v || '';
    b.appendChild(d);
  });
  document.getElementById('score').textContent = score;
  const best = Math.max(score, parseInt(localStorage.g2048Best||0));
  localStorage.g2048Best = best;
  document.getElementById('best').textContent = best;
}
const KEYS = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
window.addEventListener('keydown', e => { const k=KEYS[e.key]; if(k){ e.preventDefault(); move(k); } });
document.getElementById('restart').onclick = () => { init(); document.getElementById('msg').innerHTML='&nbsp;'; };
init();
</script>
</body></html>
