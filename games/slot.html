<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>🎰 Mini Slot Game</title>
  <link rel="stylesheet" href="game.css" />
  <style>
    body { text-align: center; }
    h1 { margin-top: 80px; }
    .slot-container {
      display: flex;
      justify-content: center;
      margin: 40px 0;
      gap: 20px;
    }
    .reel {
      width: 80px;
      height: 80px;
      background: #1e293b;
      border: 3px solid #6b46ff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 20px rgba(107, 70, 255, 0.3);
    }
    .spin-btn {
      padding: 15px 30px;
      font-size: 16px;
      background: gold;
      color: #000;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }
    .spin-btn:hover { filter: brightness(1.1); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { margin-top: 20px; font-size: 22px; min-height: 30px; }
  </style>
</head>
<body>

<a href="../index.html" class="back-to-hub">← Kembali ke Hub</a>

<h1>🎰 MINI SLOT</h1>

<div class="slot-container">
  <div class="reel" id="r1">🍒</div>
  <div class="reel" id="r2">🍋</div>
  <div class="reel" id="r3">🍉</div>
</div>

<button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>

<div id="result"></div>

<script>
const symbols = ["🍒","🍋","🍉","⭐","💎","7️⃣"];

function spin() {
  const btn = document.getElementById("spinBtn");
  btn.disabled = true;
  document.getElementById("result").innerText = "";
  let spins = 10;
  let interval = setInterval(() => {
    document.getElementById("r1").innerText = randomSymbol();
    document.getElementById("r2").innerText = randomSymbol();
    document.getElementById("r3").innerText = randomSymbol();

    spins--;

    if (spins <= 0) {
      clearInterval(interval);
      checkWin();
      btn.disabled = false;
    }
  }, 100);
}

function randomSymbol() {
  return symbols[Math.floor(Math.random() * symbols.length)];
}

function checkWin() {
  const r1 = document.getElementById("r1").innerText;
  const r2 = document.getElementById("r2").innerText;
  const r3 = document.getElementById("r3").innerText;

  if (r1 === r2 && r2 === r3) {
    document.getElementById("result").innerText = "🎉 JACKPOT!";
  } else if (r1 === r2 || r2 === r3 || r1 === r3) {
    document.getElementById("result").innerText = "👍 Lumayan!";
  } else {
    document.getElementById("result").innerText = "❌ Coba lagi!";
  }
}
</script>

</body>
</html>
