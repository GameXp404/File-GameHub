<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8" /><title>🎨 Color Click Speed</title>
<link rel="stylesheet" href="game.css" />
<style>
  .target{font-size:64px;font-weight:bold;padding:30px;border-radius:14px;background:#0f1729;border:3px solid #6b46ff;display:inline-block;margin:20px auto;min-width:300px;}
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:500px;margin:14px auto;}
  .choice{padding:24px;border-radius:10px;border:none;color:#fff;font-size:24px;font-weight:bold;cursor:pointer;text-shadow:2px 2px 4px rgba(0,0,0,0.6);transition:transform 0.1s;}
  .choice:hover{transform:scale(1.05);}
</style></head><body>
<a href="../index.html" class="back-to-hub">← Kembali ke Hub</a>
<div class="game-wrap">
  <h1>🎨 Color Click Speed</h1>
  <div class="subtitle">Klik tombol yang WARNANYA cocok dengan TEKS (bukan tulisan tombol). 30 detik!</div>
  <div class="score-row">
    <div class="score-box">Skor<b id="score">0</b></div>
    <div class="score-box">Time<b id="time">30</b></div>
    <div class="score-box">Best<b id="best">0</b></div>
  </div>
  <div id="target" class="target">--</div>
  <div class="choices" id="choices"></div>
  <div class="message" id="msg">Klik Mulai</div>
  <button class="primary" id="start">▶️ Mulai</button>
</div>
<script>
const COLORS={'MERAH':'#dc2626','HIJAU':'#16a34a','BIRU':'#2563eb','KUNING':'#facc15','UNGU':'#9333ea','ORANGE':'#ea580c'};
const NAMES=Object.keys(COLORS);let score,time,timer,running;
function init(){score=0;time=30;running=true;upd();document.getElementById('msg').textContent='GO! Klik tombol BERWARNA sesuai TEKS';document.getElementById('start').style.display='none';next();timer=setInterval(()=>{time--;upd();if(time<=0)end();},1000);}
function next(){if(!running)return;const targetName=NAMES[Math.floor(Math.random()*NAMES.length)];const fakeName=NAMES[Math.floor(Math.random()*NAMES.length)];document.getElementById('target').textContent=targetName;document.getElementById('target').style.color=COLORS[fakeName];const opts=[targetName];while(opts.length<4){const o=NAMES[Math.floor(Math.random()*NAMES.length)];if(!opts.includes(o))opts.push(o);}opts.sort(()=>Math.random()-0.5);const c=document.getElementById('choices');c.innerHTML='';opts.forEach(opt=>{const b=document.createElement('button');b.className='choice';b.textContent=opt;b.style.background=COLORS[opt];b.onclick=()=>{if(opt===targetName){score++;upd();next();}else{score=Math.max(0,score-1);upd();}};c.appendChild(b);});}
function upd(){document.getElementById('score').textContent=score;document.getElementById('time').textContent=time;document.getElementById('best').textContent=localStorage.colorClickBest||0;}
function end(){running=false;clearInterval(timer);document.getElementById('msg').textContent='⏱️ Selesai! Skor: '+score;const b=Math.max(score,parseInt(localStorage.colorClickBest||0));localStorage.colorClickBest=b;upd();document.getElementById('start').style.display='inline-block';document.getElementById('start').textContent='▶️ Coba Lagi';document.getElementById('choices').innerHTML='';document.getElementById('target').textContent='--';document.getElementById('target').style.color='#fff';}
document.getElementById('start').onclick=init;document.getElementById('best').textContent=localStorage.colorClickBest||0;
</script></body></html>
